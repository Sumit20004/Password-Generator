name: Self Hosted Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Install PM2
        run: |
          sudo npm install -g pm2

      - name: Stop Existing App
        run: |
          pm2 delete react-app || true

      - name: Start React App
        run: |
          pm2 start "npm run dev -- --host 0.0.0.0" --name frontend-app
          pm2 save

      - name: Configure PM2 Startup
        run: |
          sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp /home/$USER
          pm2 save
